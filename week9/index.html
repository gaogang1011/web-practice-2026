<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9주차 실습 - 폼 · 콤보박스 · 모달</title>
  <style>
    /* ===== reset ===== */
    *, *::before, *::after { box-sizing: border-box; }
    body, h1, h2, p, ul { margin: 0; padding: 0; }
    ul { list-style: none; }
    button, input { font: inherit; }

    /* ===== 기본 레이아웃 (수정 금지) ===== */
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      padding: 48px 16px;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 32px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    }
    h1 { font-size: 24px; margin-bottom: 24px; }
    .field { margin-bottom: 20px; }
    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      cursor: pointer;
    }
    .link-btn {
      margin-top: 16px;
      border: none;
      background: none;
      color: #64748b;
      text-decoration: underline;
      cursor: pointer;
    }

    /* ===== 여기부터 실습 과제 작성 ===== */

    /* [미션 1] 인풋 상태 스타일 (:focus · :disabled · .error · 오류 문구 표시) */
    input:focus {
      border-color: #0284c7;
      outline: 2px solid #bae6fd;
      outline-offset: 2px;
    }
    input:disabled {
      background: #f1f5f9;
      color: #64748b;
      cursor: not-allowed;
    }
    .field.error input { border-color: #dc2626; }
    .field.error input:focus { outline-color: #fecaca; }
    .field .msg {
      display: none;
      margin-top: 6px;
      color: #b91c1c;
      font-size: 13px;
    }
    .field.error .msg { display: block; }

    /* [미션 2] 버튼 상태 스타일 (:hover · :active · :disabled) */
    .btn:not(:disabled):hover { background: #0ea5e9; }
    .btn:not(:disabled):active { background: #0369a1; color: #fff; }
    .btn:disabled {
      background: #e2e8f0;
      color: #64748b;
      cursor: not-allowed;
    }

    /* [미션 3] 콤보박스 구조 · 목록 · 열림 상태 (relative · absolute 겹침 배치 · .open 목록 표시 · 화살표 회전) */
    .combo { position: relative; }
    .combo-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      color: #0f172a;
      cursor: pointer;
    }
    .combo-list {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      z-index: 1;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
    }
    .combo-list button {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }
    .combo-list button:hover,
    .combo-list button:focus-visible { background: #e0f2fe; }
    .combo.open .combo-list { display: block; }
    .combo.open .combo-btn img { transform: rotate(180deg); }

    /* [미션 4] 모달 딤드 · 박스 · 열림 상태 (position: fixed · flex 가운데 정렬 · .open 표시) */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(15, 23, 42, 0.55);
    }
    .modal.open { display: flex; }
    .modal-box {
      position: relative;
      width: 100%;
      max-width: 480px;
      padding: 32px;
      border-radius: 16px;
      background: #fff;
    }
    .modal-box h2 { margin-bottom: 12px; padding-right: 32px; }
    .modal-box p { line-height: 1.6; }
    .close {
      position: absolute;
      top: 16px;
      right: 16px;
      display: grid;
      place-items: center;
      padding: 6px;
      border: none;
      border-radius: 6px;
      background: #f1f5f9;
      cursor: pointer;
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>회원가입</h1>

    <div class="field">
      <label for="name">이름</label>
      <input type="text" id="name" placeholder="이름을 입력하세요">
    </div>

    <!-- [미션 1] 이메일 field 에 error 클래스와 오류 문구(.msg) 추가 -->
    <div class="field error">
      <label for="email">이메일</label>
      <input type="email" id="email" value="abc@jnu" aria-invalid="true" aria-describedby="email-msg">
      <p class="msg" id="email-msg">이메일 주소를 올바른 형식으로 입력해 주세요.</p>
    </div>

    <!-- [미션 1] 학번 input 에 disabled 속성 추가 -->
    <div class="field">
      <label for="student-id">학번</label>
      <input type="text" id="student-id" value="2026000000" disabled>
    </div>

    <div class="field">
      <label id="interest-label">관심 분야</label>
      <!-- [미션 3] 여기에 div 콤보박스 작성 (.combo > .combo-btn + ul.combo-list) -->
      <!-- 화살표는 arrow.svg 를 img 로 삽입 -->
      <!-- .combo 에 open 클래스를 붙여 열림 상태 확인, 제출 시엔 open 클래스 없는 상태로 제출 -->
      <div class="combo">
        <div class="combo-btn" role="button" tabindex="0"
             aria-labelledby="interest-label interest-value"
             aria-expanded="false" aria-controls="interest-options">
          <span id="interest-value">선택하세요</span>
          <img src="arrow.svg" alt="" width="20" height="20">
        </div>
        <ul class="combo-list" id="interest-options">
          <li><button type="button">HTML</button></li>
          <li><button type="button">CSS</button></li>
          <li><button type="button">JavaScript</button></li>
        </ul>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn">가입하기</button>
      <!-- [미션 2] 임시 저장 버튼에 disabled 속성 추가 -->
      <button class="btn" disabled>임시 저장</button>
    </div>

    <button class="link-btn">이용약관 보기</button>
  </div>

  <!-- [미션 4] 여기에 모달 작성 (.modal > .modal-box > button.close + h2 + p) -->
  <!-- 닫기 아이콘은 close.svg 를 button.close안에 img로 삽입 -->
  <!-- .modal 에 open 클래스를 붙여 열림 상태 확인, 제출 시엔 open 클래스 없는 상태로 제출 -->
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="terms-title">
    <div class="modal-box">
      <button type="button" class="close" aria-label="이용약관 닫기">
        <img src="close.svg" alt="" width="20" height="20">
      </button>
      <h2 id="terms-title">이용약관</h2>
      <p>회원가입 전에 이용약관을 확인해 주세요.</p>
    </div>
  </div>
  <script>
    const combo = document.querySelector('.combo');
    const comboButton = combo.querySelector('.combo-btn');
    const comboList = combo.querySelector('.combo-list');
    const interestValue = document.querySelector('#interest-value');
    const container = document.querySelector('.container');
    const termsButton = document.querySelector('.link-btn');
    const modal = document.querySelector('.modal');
    const closeButton = modal.querySelector('.close');

    function setComboOpen(open) {
      combo.classList.toggle('open', open);
      comboButton.setAttribute('aria-expanded', String(open));
    }

    comboButton.addEventListener('click', () => {
      setComboOpen(!combo.classList.contains('open'));
    });
    comboButton.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        comboButton.click();
      }
    });
    comboList.addEventListener('click', (event) => {
      const option = event.target.closest('button');
      if (option) {
        interestValue.textContent = option.textContent;
        setComboOpen(false);
        comboButton.focus();
      }
    });
    document.addEventListener('click', (event) => {
      if (!combo.contains(event.target)) {
        setComboOpen(false);
      }
    });

    function setModalOpen(open) {
      modal.classList.toggle('open', open);
      container.inert = open;
      if (open) {
        setComboOpen(false);
        closeButton.focus();
      } else {
        termsButton.focus();
      }
    }

    termsButton.addEventListener('click', () => setModalOpen(true));
    closeButton.addEventListener('click', () => setModalOpen(false));
    modal.addEventListener('click', (event) => {
      if (event.target === modal) {
        setModalOpen(false);
      }
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && modal.classList.contains('open')) {
        setModalOpen(false);
      } else if (event.key === 'Escape' && combo.classList.contains('open')) {
        setComboOpen(false);
        comboButton.focus();
      }
    });
  </script>
</body>
</html>
